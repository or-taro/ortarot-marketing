name: Threads publish

# 쓰레드 자동 게시. 주인님이 승인("진행")한 글만 threads/queue/ 에 들어오고,
# 30분마다 게시 시각이 지난 글을 올린다. 24시간 넘게 늦은 글은 올리지 않는다(expired).
# Secrets (주인님이 직접 등록, 디는 값을 볼 수 없음):
#   THREADS_ACCESS_TOKEN  장기 토큰(60일). 매주 월요일 자동 갱신
#   GH_SECRET_PAT         (선택) 이 저장소 Secrets 쓰기 권한만 있는 토큰. 있으면 갱신된 토큰을 자동 저장
on:
  schedule:
    - cron: "4,34 * * * *"     # 30분마다 대기열 확인
    - cron: "17 18 * * 0"      # 매주 월요일 03:17 KST 토큰 갱신
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, validate, due, refresh, insights, comments]
        default: check

permissions:
  contents: write

# 게시(due)는 한 줄로만. 확인·숫자 읽기·토큰 갱신은 대기 중인 게시 실행에 막히지 않게 따로 줄을 세운다.
concurrency:
  group: threads-${{ github.event.schedule == '17 18 * * 0' && 'refresh' || ((github.event_name == 'workflow_dispatch' && inputs.mode != 'due') && inputs.mode || 'publish') }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Pick mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}";
          elif [ "${{ github.event.schedule }}" = "17 18 * * 0" ]; then m=refresh; else m=due; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "mode: $m"
      # 2026-11-22: GitHub 예약 실행이 30분 간격이 아니라 하루 2~4번(5~9시간 간격)만 돌아 글이 2~12시간 늦게 올라감.
      # 그래서 게시 실행은 바로 끝내지 않고, 다음 게시·답 공개가 약 5시간 40분 안에 있으면 그 시각까지 기다렸다가 올린다.
      - name: Publish due posts (wait for upcoming ones)
        if: ${{ steps.m.outputs.mode == 'due' }}
        env:
          TH_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          WATCH_MIN: "340"
        run: |
          git config user.name "ortarot-bot"; git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + WATCH_MIN*60 )); fails=0
          while :; do
            git pull --rebase -q || true
            nxt=$(python3 .github/scripts/threads_publish.py next)
            now=$(date +%s)
            if [ -z "$nxt" ]; then echo "nothing pending"; break; fi
            python3 .github/scripts/threads_publish.py comments || echo "::warning::comments failed"
            git add threads/comment_answers.json 2>/dev/null || true
            if ! git diff --cached --quiet; then git commit -qm "threads: comment readings"; for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done; fi
            if [ "$nxt" -gt "$now" ]; then
              if [ "$nxt" -gt "$end" ]; then echo "next at $(date -u -d @$nxt +%FT%TZ), beyond this run"; break; fi
              echo "waiting until $(date -u -d @$nxt +%FT%TZ)"; sleep $(( nxt - now + 20 )); continue
            fi
            if python3 .github/scripts/threads_publish.py due; then fails=0; else fails=$((fails+1)); fi
            git add threads/published.json
            if ! git diff --cached --quiet; then
              git commit -qm "threads: publish record"
              for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
            fi
            if [ "$fails" -ge 3 ]; then echo "::error::due failed 3 times"; exit 1; fi
            [ "$fails" -gt 0 ] && sleep 300
          done
      - name: Run
        if: ${{ steps.m.outputs.mode != 'due' }}
        env:
          TH_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TH_NEW_TOKEN_FILE: /tmp/th_new_token
        run: python3 .github/scripts/threads_publish.py "${{ steps.m.outputs.mode }}"
      - name: Save comment answers
        if: ${{ steps.m.outputs.mode == 'comments' }}
        run: |
          git config user.name "ortarot-bot"; git config user.email "actions@users.noreply.github.com"
          git add threads/comment_answers.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -qm "threads: comment readings"; for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done; fi
      - name: Save refreshed token
        if: ${{ steps.m.outputs.mode == 'refresh' }}
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_PAT }}
        run: |
          if [ ! -s /tmp/th_new_token ]; then echo "::error::no refreshed token"; exit 1; fi
          echo "::add-mask::$(cat /tmp/th_new_token)"
          if [ -z "$GH_TOKEN" ]; then echo "::warning::GH_SECRET_PAT 없음: 토큰 기간은 늘었지만 새 값이 다르면 저장되지 않음"; exit 0; fi
          gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/th_new_token
          rm -f /tmp/th_new_token; echo "PASS: secret updated"
